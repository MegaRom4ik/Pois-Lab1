name: Build, test and document
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm cppcheck doxygen
      - name: Build
        run: make all
      - name: Test and require more than 90 percent domain line coverage
        run: make test coverage
      - name: Static analysis
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c++17 --suppress=missingIncludeSystem lab1/vector lab1/tictactoe lab1/cli
      - name: Generate documentation
        run: make docs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-docs-coverage
          path: |
            build/vector_cli
            build/tictactoe_cli
            build/docs/html
            build/coverage
  release:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and documentation generator
        run: sudo apt-get update && sudo apt-get install -y clang doxygen
      - name: Build portable Linux x86_64 binaries
        run: make all CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -static'
      - name: Package binaries and documentation
        run: |
          make docs
          tar -czf build/ppois-linux-x86_64.tar.gz -C build vector_cli tictactoe_cli docs/html
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/ppois-linux-x86_64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/ppois-linux-x86_64.tar.gz --verify-tag --generate-notes
          fi
